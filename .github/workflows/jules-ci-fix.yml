name: Jules CI Failure Auto-Fix

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

concurrency:
  group: jules-ci-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  fix-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Invoke Jules to fix failure
        uses: google-labs-code/jules-invoke@v1
        with:
          prompt: |
            The CI workflow "${{ github.event.workflow_run.name }}" has failed.

            **Failed Run:** ${{ github.event.workflow_run.html_url }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Commit:** ${{ github.event.workflow_run.head_sha }}

            Please:
            1. Analyze the failure from the workflow run
            2. Identify the root cause
            3. Implement a fix on the same repository branch
            4. Ensure the fix passes CI

            Focus on test failures and syntax errors first. Do not weaken tests to make the run green.

          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.event.workflow_run.head_branch }}
          include_last_commit: true
