name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run focused Node tests
        run: node --experimental-strip-types --test test/*.test.mjs
      - name: Check all TypeScript syntax surfaces
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --experimental-strip-types --check "$file"
          done < <(find src -name '*.ts' -type f -print | sort)
